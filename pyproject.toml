[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svrecttail"
version = "0.1.0"
description = "Auditable rectangular OCTA speckle-variance tail quantification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.12",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydicom>=3.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
svrecttail = "svrecttail.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/python"]
pythonpath = ["src"]
