name: SV Diameter Stage2 Scientific v1

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/sv-diameter-stage2
    paths:
      - analysis/sv_diameter_stage2_scientific_v1/_trigger.txt

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Stage2 branch
        uses: actions/checkout@v4
        with:
          ref: analysis/sv-diameter-stage2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas matplotlib

      - name: Run Stage2 scientific analysis
        run: python scripts/analyze_sv_diameter_stage2.py

      - name: Commit generated Stage2 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/sv_diameter_stage2_scientific_v1/
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'analysis(sv): add diameter stage2 scientific results'
          git pull --rebase origin analysis/sv-diameter-stage2
          git push origin HEAD:analysis/sv-diameter-stage2
