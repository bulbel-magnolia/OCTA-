name: Spatial autocorrelation full2422

on:
  workflow_dispatch:
  push:
    branches:
      - feature/sv-rectangle-v1
    paths:
      - analysis/formal_sv_d128_v21_run001/spatial_autocorrelation_full2422/analyze_spatial_autocorrelation.py
      - analysis/formal_sv_d128_v21_run001/spatial_autocorrelation_full2422/_trigger.txt
      - .github/workflows/spatial-autocorrelation-full2422.yml

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/sv-rectangle-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas

      - name: Analyze spatial autocorrelation
        run: |
          python analysis/formal_sv_d128_v21_run001/spatial_autocorrelation_full2422/analyze_spatial_autocorrelation.py \
            --root . \
            --task1-dir analysis/formal_sv_d128_v21_run001/relative_tail_intensity_full2422 \
            --formal-dir results/formal_sv_d128_v21_full2500_run001 \
            --output-dir analysis/formal_sv_d128_v21_run001/spatial_autocorrelation_full2422 \
            --max-lag 200 \
            --source-sha f446d811c1b2b482f79a75693836b41a04361c11 \
            --workflow-source-sha "${{ github.sha }}"

      - name: Commit generated autocorrelation outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/formal_sv_d128_v21_run001/spatial_autocorrelation_full2422/
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'analysis: add spatial autocorrelation results'
          git push origin HEAD:feature/sv-rectangle-v1
