name: Systematic subsampling stability full2422

on:
  workflow_dispatch:
  push:
    branches:
      - feature/sv-rectangle-v1
    paths:
      - analysis/formal_sv_d128_v21_run001/subsampling_stability_full2422/analyze_subsampling_stability.py
      - .github/workflows/subsampling-stability-full2422.yml

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/sv-rectangle-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas

      - name: Analyze systematic subsampling stability
        run: |
          python analysis/formal_sv_d128_v21_run001/subsampling_stability_full2422/analyze_subsampling_stability.py \
            --root . \
            --task1-dir analysis/formal_sv_d128_v21_run001/relative_tail_intensity_full2422 \
            --output-dir analysis/formal_sv_d128_v21_run001/subsampling_stability_full2422 \
            --source-sha 2ba519479a5a5ef7ff3c2d5e13c148d17b613e5d \
            --workflow-source-sha "${{ github.sha }}"

      - name: Commit generated subsampling outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/formal_sv_d128_v21_run001/subsampling_stability_full2422/
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'analysis: add systematic subsampling stability results'
          git push origin HEAD:feature/sv-rectangle-v1
