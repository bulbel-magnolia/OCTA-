name: Method sensitivity effect context full2422

on:
  workflow_dispatch:
  push:
    branches:
      - feature/sv-rectangle-v1
    paths:
      - analysis/formal_sv_d128_v21_run001/method_sensitivity_effect_context_full2422/analyze_method_sensitivity_effect_context.py
      - .github/workflows/method-sensitivity-effect-context-full2422.yml

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/sv-rectangle-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas

      - name: Analyze observed effects against audited method sensitivities
        run: |
          python analysis/formal_sv_d128_v21_run001/method_sensitivity_effect_context_full2422/analyze_method_sensitivity_effect_context.py \
            --root . \
            --source-sha d6fc2b714354a0f2b01f13da870906475f430a78 \
            --workflow-source-sha "${{ github.sha }}"

      - name: Commit generated context outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/formal_sv_d128_v21_run001/method_sensitivity_effect_context_full2422/
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'analysis: add method-sensitivity effect context results'
          git push origin HEAD:feature/sv-rectangle-v1
